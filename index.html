            (function () {
                var scrollZone = document.querySelector(".home-scroll-zone");
                var homeHero = document.querySelector(".home-hero");

                function updateLandingState() {
                    var isOnLanding = homeHero.getBoundingClientRect().bottom > 0;
                    scrollZone.classList.toggle("is-on-landing", isOnLanding);
                    scrollZone.tabIndex = isOnLanding ? 0 : -1;
                }

                window.addEventListener("scroll", updateLandingState, { passive: true });
                window.addEventListener("resize", updateLandingState);
                updateLandingState();

                window.addEventListener("pointermove", function (event) {
                    if (event.pointerType !== "mouse") return;

                    var isInBottomQuarter = event.clientY >= window.innerHeight * 0.75;
                    scrollZone.classList.toggle("is-pointer-in-zone", isInBottomQuarter);
                }, { passive: true });
            })();
        </script>

                <script src="https://player.vimeo.com/api/player.js"></script>
                <script>
                    (function () {
                        var preview = document.querySelector(".motion-preview");
                        if (!preview) return;
                        var link = preview.closest("a");
                        var player = new Vimeo.Player(preview.querySelector("iframe"));
                        var isPointerOver = false;
                        var isFocused = false;
                        var isPreviewing = false;
                        var isResetting = false;
                        var previewDuration = 10;
                        async function updateVideoAspectRatio() {
                            try {
                                var dimensions = await Promise.all([
                                player.getVideoWidth(),
                                player.getVideoHeight()
                                ]);
                                if (dimensions[0] > 0 && dimensions[1] > 0) {
                                    preview.style.setProperty("--motion-video-ratio", dimensions[0] / dimensions[1]);
                                }
                            } catch (error) {
                                console.error("Could not size Motion card video:", error);
                            }
                        }
                        async function startPreview() {
                            if (isPreviewing) return;
                            isPreviewing = true;
                            try {
                                await player.setMuted(true);
                                await player.setLoop(true);
                                if (isPreviewing) {
                                    await player.play();
                                }
                            } catch (error) {
                                isPreviewing = false;
                                console.error("Could not preview Motion card video:", error);
                            }
                        }
                        async function stopPreview() {
                            if (isPointerOver || isFocused || !isPreviewing) return;
                            isPreviewing = false;
                            try {
                                await player.pause();
                                await player.setCurrentTime(0);
                            } catch (error) {
                                console.error("Could not stop Motion card preview:", error);
                            }
                        }
                        async function restartPreview() {
                            if (!isPreviewing || isResetting) return;
                            isResetting = true;
                            try {
                                await player.pause();
                                await player.setCurrentTime(0);
                                if (isPreviewing) {
                                    await player.play();
                                }
                            } catch (error) {
                                console.error("Could not loop Motion card preview:", error);
                            } finally {
                                isResetting = false;
                            }
                        }
                        player.on("loaded", updateVideoAspectRatio);
                        player.ready().then(updateVideoAspectRatio).catch(function (error) {
                            console.error("Could not initialize Motion card video sizing:", error);
                        });
                        player.on("timeupdate", function (data) {
                            if (data.seconds >= previewDuration) {
                                restartPreview();
                            }
                        });
                        player.on("ended", restartPreview);
                        link.addEventListener("pointerenter", function () {
                            isPointerOver = true;
                            startPreview();
                        });
                        link.addEventListener("pointerleave", function () {
                            isPointerOver = false;
                            stopPreview();
                        });
                        link.addEventListener("focus", function () {
                            isFocused = true;
                            startPreview();
                        });
                        link.addEventListener("blur", function () {
                            isFocused = false;
                            stopPreview();
                        });
                    })();
                </script>
